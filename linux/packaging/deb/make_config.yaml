display_name: FunClash
# The name `apt install` takes, which Debian requires to be lower case. It is
# the repository name rather than the display name because the APT source at
# farfarfun.github.io/packages indexes one package per repository.
package_name: funclash
maintainer:
  name: farfarfun
  email: farfarfun@qq.com

priority: optional
section: x11
# KiB of the unpacked tree, which is what `apt install` reports as the disk it
# is about to use and what it checks the free space against. Measured, not
# guessed: `dpkg-deb -c` over a built package sums to ~156 MB.
installed_size: 156000
essential: false
icon: ./assets/images/icon.png

dependencies:
  - libayatana-appindicator3-1
  - libsecret-1-0
  - libgtk-3-0
  - libgl1-mesa-dri
  - xvfb
  - xauth
  - dbus
  - util-linux

# The Helper unit is written on demand by the app, not at install time, so only
# its teardown belongs here; the binary is already gone when postrm runs.
postuninstall_scripts:
  - 'case "${1:-}" in remove|purge) ;; *) exit 0 ;; esac'
  - 'systemctl disable --now funclash-helper.service >/dev/null 2>&1 || true'
  - 'rm -f /etc/systemd/system/funclash-helper.service'
  - 'systemctl daemon-reload >/dev/null 2>&1 || true'

supported_mime_type:
  - x-scheme-handler/clash
  - x-scheme-handler/clashmeta
  - x-scheme-handler/funclash

keywords:
  - FunClash
  - Clash
  - ClashMeta
  - Proxy

generic_name: FunClash

categories:
  - Network

startup_notify: true

startup_wm_class: com.farfarfun.funclash
