<?xml version="1.0" encoding="UTF-8"?>
<!-- Logo glyph: an F whose three strokes never touch, so they stay readable at
     tray size. Capsules on a 240 grid, stroke 44, radius 22.
     The Android drawables ic.xml, ic_service.xml and the launcher foregrounds
     carry the same geometry as fill paths. -->
<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <title>glyph</title>
  <g stroke-width="44" stroke-linecap="round">
    <line x1="116" y1="62" x2="182" y2="62" stroke="#6666FB"/>
    <line x1="116" y1="130" x2="158" y2="130" stroke="#5CA8E9"/>
    <line x1="62" y1="58" x2="62" y2="182" stroke="#336AB6"/>
  </g>
</svg>
